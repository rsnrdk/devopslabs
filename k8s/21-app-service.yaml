# ClusterIP part: nest-devops:80 inside the cluster; NodePort part: <minikube ip>:30080 from the host
apiVersion: v1
kind: Service
metadata:
  name: nest-devops
  namespace: nest-devops
  labels:
    app.kubernetes.io/name: nest-devops
    app.kubernetes.io/component: app
    app.kubernetes.io/part-of: nest-devops
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: nest-devops
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
