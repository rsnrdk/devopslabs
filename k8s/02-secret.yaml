# Sensitive settings. stringData is plain text here and Kubernetes stores it base64-encoded.
# These are throwaway values for a local minikube cluster, not real passwords.
apiVersion: v1
kind: Secret
metadata:
  name: nest-devops-secrets
  namespace: nest-devops
  labels:
    app.kubernetes.io/name: nest-devops
    app.kubernetes.io/part-of: nest-devops
type: Opaque
stringData:
  DB_PASSWORD: "minikube-db-password"
  ADMIN_TOKEN: "minikube-admin-token"
