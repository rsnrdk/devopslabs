# Development: one replica, small resources, newest image, no Ingress.
replicaCount: 1

image:
  tag: "1.1.0"

resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    cpu: 250m
    memory: 192Mi

ingress:
  enabled: false

config:
  environment: dev
  greeting: "Hello from the dev environment"
