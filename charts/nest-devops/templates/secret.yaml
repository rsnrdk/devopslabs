{{- if not .Values.secrets.existingSecret }}
# Values come from the chart values (secrets.*), nothing is hard-coded in this template.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nest-devops.secretName" . }}
  labels:
    {{- include "nest-devops.labels" . | nindent 4 }}
type: Opaque
data:
  DB_PASSWORD: {{ required "secrets.dbPassword is required (or set secrets.existingSecret)" .Values.secrets.dbPassword | b64enc | quote }}
  ADMIN_TOKEN: {{ required "secrets.adminToken is required (or set secrets.existingSecret)" .Values.secrets.adminToken | b64enc | quote }}
{{- end }}
