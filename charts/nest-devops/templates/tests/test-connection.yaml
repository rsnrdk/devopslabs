{{- if .Values.tests.enabled }}
# helm test <release>: the app is ready and serves exactly the version this release deployed
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "nest-devops.fullname" . }}-test
  labels:
    {{- include "nest-devops.commonLabels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: check
      image: {{ .Values.tests.image }}
      command:
        - sh
        - -c
        - |
          set -e
          base="http://{{ include "nest-devops.fullname" . }}:{{ .Values.service.port }}"
          wget -qO- "$base/health/ready"; echo
          version=$(wget -qO- "$base/version")
          echo "$version"
          echo "$version" | grep -q '"version":"{{ include "nest-devops.imageTag" . }}"'
          echo "OK: version {{ include "nest-devops.imageTag" . }} is running"
{{- end }}
