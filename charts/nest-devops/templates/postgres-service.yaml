{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nest-devops.postgres.fullname" . }}
  labels:
    {{- include "nest-devops.postgres.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "nest-devops.postgres.selectorLabels" . | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
{{- end }}
